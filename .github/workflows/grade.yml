# Replays the practice mailbox through the harness and keeps the report card.
# Needs a repository secret ANTHROPIC_API_KEY; each run spends from it, so it runs by hand only.
name: grade

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup
        run: make setup
      - name: Practice grader
        run: make grade
      - name: Keep the report card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-card
          path: |
            report_card.txt
            report_card.json
